name: tmp e2e
on:
  push:
    branches: [tmp/admin-fix]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MODA_ENMA }}
      - run: |
          mkdir /tmp/w && cd /tmp/w && npm init -y >/dev/null && npm i firebase-admin@12 playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cp "$GITHUB_WORKSPACE/.github/scripts/e2e.mjs" /tmp/w/
          node /tmp/w/e2e.mjs
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
