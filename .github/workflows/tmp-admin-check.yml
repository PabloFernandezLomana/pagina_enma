name: tmp pubkey
on:
  push:
    branches: [tmp/admin-fix]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MODA_ENMA }}
      - run: node .github/scripts/pubkey.mjs
