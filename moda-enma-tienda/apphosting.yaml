# moda-enma-tienda/apphosting.yaml — Firebase App Hosting (plan Blaze)
runConfig:
  minInstances: 0
  maxInstances: 3
  memoryMiB: 512
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: REEMPLAZA
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: REEMPLAZA
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: REEMPLAZA
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: REEMPLAZA
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: REEMPLAZA
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: REEMPLAZA
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://REEMPLAZA-TU-DOMINIO
    availability: [BUILD, RUNTIME]
  - variable: PAYPAL_ENV
    value: sandbox
    availability: [RUNTIME]
  - variable: NEXT_PUBLIC_PAYPAL_CLIENT_ID
    secret: PAYPAL_CLIENT_ID        # firebase apphosting:secrets:set PAYPAL_CLIENT_ID
    availability: [BUILD, RUNTIME]
  - variable: PAYPAL_CLIENT_SECRET
    secret: PAYPAL_CLIENT_SECRET
    availability: [RUNTIME]
  - variable: PAYPAL_WEBHOOK_ID
    secret: PAYPAL_WEBHOOK_ID
    availability: [RUNTIME]
